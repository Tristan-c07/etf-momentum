# ETF 动量策略实验配置

# ========== 回测时间段 ==========
start_date: "2020-01-01"
end_date: "2025-12-31"

# ========== 调仓参数 ==========
rebalance_every: 5  # 调仓频率（交易日），5 表示周频调仓
momentum_window: 20  # 动量计算窗口（交易日），20 日动量与周频更匹配

# ========== 选股与权重 ==========
topk: 10  # 每期持仓 Top K 只 ETF
weighting: "equal"  # 权重方案：equal（等权）、momentum（动量加权）、volatility（波动率加权）
max_weight: 0.15  # 单只 ETF 最大权重上限，避免过度集中

# ========== 交易成本 ==========
cost_bps: 5  # 单边交易成本（基点），5 bps = 0.05%

# ========== 风控参数（预留）==========
# stop_loss: 0.05  # 止损阈值
# volatility_target: 0.15  # 目标波动率
